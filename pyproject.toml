[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-moss-tokenizer"
version = "0.3.0"
description = "Exact GPU acceleration for MOSS Audio Tokenizer v2, 48 kHz stereo"
requires-python = ">=3.12"
dependencies = [
    "torch==2.8.0",
    "triton==3.4.0",
    "cuda-bindings==13.4.2",
    "nvidia-cuda-nvrtc-cu12==12.8.93",
    "accelerate",
    "safetensors",
    "huggingface-hub",
    "numpy",
    "soundfile",
    "transformers @ git+https://github.com/huggingface/transformers.git@4ac58b368aff171c8b45a976b0de9ec3b22a4bdd",
]

[tool.setuptools.packages.find]
include = ["fast_moss*"]
